<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#161826" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Deník údržbáře</title>
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;650;700;800&family=Inter:wght@400;500;550;600;650;700;750&display=swap" rel="stylesheet" />
<link rel="preconnect" href="https://unpkg.com" crossorigin />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/bold/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.2/src/fill/style.css" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; overscroll-behavior-y: none; height: 100%;
    -webkit-user-select: none; user-select: none;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: #161826;
  }
  input, textarea { -webkit-user-select: text; user-select: text; font-family: inherit; }
  #root { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); background-color: #161826; }
  button { font-family: inherit; -webkit-tap-highlight-color: transparent; cursor: pointer; background: none; border: none; }
  ::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="root">
  <div style="height:100%;display:flex;align-items:center;justify-content:center;">
    <div style="width:56px;height:56px;border-radius:16px;background:rgba(145,132,217,0.12);border:1px solid rgba(145,132,217,0.45);display:flex;align-items:center;justify-content:center;">
      <div style="width:22px;height:22px;border-radius:50%;border:2.5px solid rgba(145,132,217,0.25);border-top-color:#9184d9;animation:spin 0.8s linear infinite;"></div>
    </div>
  </div>
</div>
<style>@keyframes spin { to { transform: rotate(360deg); } }
@keyframes livePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }</style>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script type="text/babel" data-presets="react" src="app.jsx"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then((registration) => {
        // GitHub Pages posílá cachovací hlavičky i na sw.js, takže prohlížeč
        // může jeho aktualizaci zjistit až s velkým zpožděním. Vynutíme
        // kontrolu update při každém otevření appky (update() obchází HTTP
        // cache pro samotný sw.js request) a jakmile se nová verze aktivuje,
        // appku rovnou obnovíme, ať se nová verze projeví hned, ne až při
        // další náhodné návštěvě.
        registration.update().catch(() => {});

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      }).catch(() => {});
    });
  }
</script>
</body>
</html>
